<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== REDIRECT: the old Google Site's Home page lived at /home.
       Old links (LinkedIn, bookmarks) land here and are sent on to the
       new Home page at "/". GitHub Pages serves this file for /home. ===== -->
  <meta charset="utf-8">
  <title>Stoic Science</title>
  <!-- Tells search engines the real page is the site root -->
  <link rel="canonical" href="https://stoicscience.us/">
  <meta name="robots" content="noindex">
  <!-- Redirect after 0 seconds (works even with JavaScript off) -->
  <meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <!-- Fallback link, shown only if the redirect doesn't happen -->
  <p><a href="/">Continue to Stoic Science</a></p>
</body>
</html>
